<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<meta name="robots" content="noindex,follow"/>
<title>Page not found — The Scriptwriter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg1:#fff;--bg2:#f5f5f3;
  --tx1:#1a1a18;--tx2:#666663;--tx3:#999997;
  --bd3:rgba(0,0,0,0.1);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --accent:#378ADD;
}
@media(prefers-color-scheme:dark){:root{
  --bg1:#1a1a18;--bg2:#242422;
  --tx1:#f0ede8;--tx2:#999997;--tx3:#666663;
  --bd3:rgba(255,255,255,0.1);
  --accent:#5BA3E6;
}}
body{font-family:var(--sans);background:var(--bg1);color:var(--tx1);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
.wrap{max-width:480px;text-align:center;}
.brand{font-family:'Courier New',Courier,monospace;font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:32px;color:var(--tx1);}
.code{font-family:'Courier New',Courier,monospace;font-size:72px;font-weight:700;letter-spacing:-2px;color:var(--bd3);line-height:1;margin-bottom:16px;}
h1{font-size:20px;font-weight:600;margin-bottom:10px;}
p{font-size:14px;color:var(--tx2);line-height:1.6;margin-bottom:28px;}
.btn{display:inline-block;background:var(--tx1);color:var(--bg1);font-family:var(--sans);font-size:14px;font-weight:500;padding:10px 24px;border-radius:8px;text-decoration:none;transition:opacity .15s;}
.btn:hover{opacity:.85;text-decoration:none;}
.links{margin-top:20px;font-size:13px;color:var(--tx3);}
.links a{color:var(--tx2);}
.links a:hover{color:var(--tx1);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">The Scriptwriter</div>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or may have moved. Head back to the editor — your script is waiting.</p>
  <a class="btn" href="/">Open the editor</a>
  <div class="links">
    <a href="/guide.html">Feature guide</a> &middot;
    <a href="/compare.html">Compare editors</a> &middot;
    <a href="/blog/">Blog</a> &middot;
    <a href="/privacy.html">Privacy</a>
  </div>
</div>
</body>
</html>
