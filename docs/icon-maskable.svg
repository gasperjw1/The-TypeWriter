<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background — no rounded corners. The OS applies its own
       mask shape (circle, squircle, etc.). Content sits inside the inner
       80% "safe zone" so it isn't clipped under any mask. -->
  <rect width="512" height="512" fill="#1a1a18"/>
  <g transform="translate(256,256) scale(0.82)">
    <!-- Pen body -->
    <path d="M-20,120 L0,-140 L20,120 Q10,140 0,145 Q-10,140 -20,120Z" fill="#EF9F27" opacity="0.9"/>
    <!-- Pen tip -->
    <path d="M-6,120 L0,160 L6,120Z" fill="#fff"/>
    <!-- Center line -->
    <line x1="0" y1="-100" x2="0" y2="110" stroke="#1a1a18" stroke-width="3" opacity="0.3"/>
    <!-- Ink drop -->
    <circle cx="0" cy="175" r="8" fill="#378ADD" opacity="0.8"/>
    <!-- "S" lettermark — positioned in the g's local coordinate space -->
    <text x="0" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="180" font-weight="700" fill="#fff" opacity="0.15">S</text>
  </g>
</svg>
