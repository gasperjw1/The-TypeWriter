name: Sync docs/index.html

on:
  push:
    branches: [main]
    paths: [script_maker.html]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy script_maker.html to docs/index.html
        run: cp script_maker.html docs/index.html

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet docs/index.html && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Sync docs/index.html with script_maker.html"
          git push
